<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}École maternelle{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container justify-content-between">
            <a class="navbar-brand" href="{% url 'home' %}">École maternelle</a>
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                <span class="navbar-text text-light me-3">{{ user.first_name|default:user.username }}</span>
                <form method="post" action="{% url 'accounts:logout' %}" class="mb-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Déconnexion</button>
                </form>
                {% else %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:login' %}">Connexion</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
